name: Java CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test
      - name: Validate benchmark PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/benchmark-10m.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Benchmark smoke test (4 sequential jobs x 1000 records)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Records 1000
      - name: Verify live progress and generated HTML reports
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'benchmark-10m-*')
          if ($reports.Count -ne 1) { throw "Se esperaba exactamente un directorio de benchmark" }
          $dir = $reports[0].FullName
          $expected = @(
            'index.html','prueba-base.html','prueba-A.html','prueba-B.html','prueba-C.html',
            'resumen.csv','progreso.log',
            'logs/job-base.log','logs/job-A.log','logs/job-B.log','logs/job-C.log'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path $dir $file))) {
              throw "Falta el archivo $file en $dir"
            }
          }
          $logText = Get-Content (Join-Path $dir 'progreso.log') -Raw
          if ($logText -notmatch 'AVANCE:') { throw "No se generaron avances de lectura/escritura" }
          if ($logText -notmatch 'BENCHMARK TERMINADO') { throw "Falta el cierre correcto del benchmark" }
      - name: Single-partition smoke test (1 worker, 1000 records)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Records 1000 -SinglePartition
      - name: Verify single-partition HTML and metadata
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'particion-unica-10m-*')
          if ($reports.Count -ne 1) { throw "Se esperaba un informe de particion unica" }
          $dir = $reports[0].FullName
          foreach ($file in @('index.html','prueba-single.html','resumen.csv','progreso.log','logs/job-single.log')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file en $dir" }
          }
          $rows = @(Import-Csv (Join-Path $dir 'resumen.csv'))
          if ($rows.Count -ne 1) { throw "Se esperaba exactamente una prueba" }
          $r = $rows[0]
          if ($r.Id -ne 'single' -or $r.Grid -ne '1' -or $r.Threads -ne '1' -or
              $r.Chunk -ne '500' -or $r.Page -ne '1000' -or $r.DbPool -ne '6' -or
              $r.Status -ne 'COMPLETED' -or $r.Read -ne '1000' -or $r.Written -ne '1000') {
            throw "Configuracion o contadores inesperados: $($r | Out-String)"
          }
          $progress = Get-Content (Join-Path $dir 'progreso.log') -Raw
          if ($progress -notmatch 'PRUEBA single AVANCE:') { throw "Falta progreso de particion unica" }
      - name: Validate all test profiles without Docker
        shell: pwsh
        run: |
          foreach ($profile in @('quick','medium','full','custom','manual','single','simple','stress150','benchmark')) {
            ./scripts/benchmark-10m.ps1 -Profile $profile -Records 1000 -ValidateOnly
            if ($LASTEXITCODE -ne 0) { throw "Perfil invalido: $profile" }
          }
      - name: Parameterized quick test and HTML (custom limits)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Profile quick -Records 1000 -Chunk 1000 -Page 1000 -Grid 1 -Threads 1 -Pool 6 -HeapMiB 256 -MemoryMiB 768 -SeedBlock 500
      - name: Verify parameter overrides in report and Compose
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'prueba-quick-*')
          if ($reports.Count -ne 1) { throw "Se esperaba un informe quick" }
          $dir = $reports[0].FullName
          $r = @(Import-Csv (Join-Path $dir 'resumen.csv'))[0]
          if ($r.Chunk -ne '1000' -or $r.Page -ne '1000' -or $r.Grid -ne '1' -or
              $r.Threads -ne '1' -or $r.DbPool -ne '6' -or $r.HeapLimitMiB -ne '256' -or
              $r.MemoryLimitMiB -ne '768' -or $r.SeedBlock -ne '500' -or
              $r.Written -ne '1000' -or $r.Status -ne 'COMPLETED') {
            throw "Override no aplicado: $($r | Out-String)"
          }
          if (-not (Test-Path (Join-Path $dir 'prueba-quick.html'))) { throw "Falta HTML quick" }
      - name: Simple 500MiB Batch memory smoke test
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Profile simple
      - name: Verify simple test limits and HTML report
        shell: pwsh
        run: |
          $dirs = @(Get-ChildItem -Path reports -Directory -Filter 'prueba-simple-*')
          if ($dirs.Count -ne 1) { throw "Se esperaba un informe simple" }
          $dir = $dirs[0].FullName
          foreach ($file in @('index.html','prueba-simple.html','resumen.csv','progreso.log','logs/job-simple.log')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file" }
          }
          $r = @(Import-Csv (Join-Path $dir 'resumen.csv'))[0]
          if ($r.Id -ne 'simple' -or $r.Read -ne '1000' -or $r.Written -ne '1000' -or
              $r.Grid -ne '1' -or $r.Threads -ne '1' -or
              $r.MemoryLimitMiB -ne '500' -or $r.HeapLimitMiB -ne '256' -or
              $r.Status -ne 'COMPLETED') {
            throw "Configuracion simple inesperada: $($r | Out-String)"
          }
      - name: Run intentional 150MiB memory stress and retain diagnostics
        shell: pwsh
        run: |
          # El micro puede salir con un codigo distinto de 0: es el resultado
          # que queremos observar, no un error del pipeline de CI.
          # Ejecutar en un proceso hijo evita que exit 1 del test esperado
          # termine el wrapper de GitHub Actions antes de revisar los informes.
          $PSNativeCommandUseErrorActionPreference = $false
          & pwsh -NoProfile -File ./scripts/benchmark-10m.ps1 -Profile stress150 -Records 1000
          $exitCode = $LASTEXITCODE
          Write-Host "Stress150 process exit code: $exitCode"
          $dirs = @(Get-ChildItem -Path reports -Directory -Filter 'prueba-stress150-*')
          if ($dirs.Count -ne 1) { throw "Falta directorio de stress150" }
          $dir = $dirs[0].FullName
          foreach ($file in @('index.html','prueba-stress150.html','resumen.csv','progreso.log','logs/job-stress150.log')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta archivo de diagnostico: $file" }
          }
          $r = @(Import-Csv (Join-Path $dir 'resumen.csv'))[0]
          if ($r.Id -ne 'stress150' -or $r.MemoryLimitMiB -ne '150' -or $r.HeapLimitMiB -ne '128' -or
              $r.Grid -ne '1' -or $r.Threads -ne '1') {
            throw "Los limites de stress150 no se aplicaron: $($r | Out-String)"
          }
          Write-Host "Stress150 result: $($r.Status); Java/container exit: $($r.DockerExitCode)"
      - name: CLI individual scenario with custom reports root containing spaces
        shell: pwsh
        run: |
          ./scripts/benchmark-10m.ps1 -Profile A -Records 1000 -Chunk 250 -Grid 1 -Threads 1 -Pool 6 -ReportsDir 'reports/custom outputs'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo ejecutar el escenario A independiente' }
          $folders = @(Get-ChildItem 'reports/custom outputs' -Directory -Filter 'prueba-A-*')
          if ($folders.Count -ne 1) { throw 'Falta el informe A en la carpeta elegida' }
          $root = $folders[0].FullName
          foreach($file in @('index.html','prueba-A.html','resumen.csv','progreso.log','logs/job-A.log')) {
            if (-not (Test-Path (Join-Path $root $file))) { throw "No existe $file" }
          }
          $rows = @(Import-Csv (Join-Path $root 'resumen.csv'))
          if ($rows.Count -ne 1 -or $rows[0].Id -ne 'A' -or $rows[0].Chunk -ne '250' -or
              $rows[0].Grid -ne '1' -or $rows[0].Threads -ne '1' -or $rows[0].Written -ne '1000' -or
              $rows[0].Status -ne 'COMPLETED') { throw "Parametros A inesperados: $($rows | Out-String)" }
      - name: Interactive configuration accepts typed values and Enter defaults
        shell: pwsh
        run: |
          # Simulamos respuestas a Read-Host para verificar el asistente sin
          # bloquear el CI ni poner en marcha Docker.
          $global:answerQueue = New-Object System.Collections.Queue
          @('1250','','250','','','','','','','reports/interactive space') |
            ForEach-Object { $global:answerQueue.Enqueue($_) }
          $global:questions = 0
          function Read-Host([string]$Prompt) {
            $global:questions++
            if ($global:answerQueue.Count -eq 0) { throw "Pregunta inesperada: $Prompt" }
            $answer = $global:answerQueue.Dequeue()
            Write-Host ("Pregunta: {0} / Respuesta: {1}" -f $Prompt,$answer)
            return $answer
          }
          ./scripts/benchmark-10m.ps1 -Profile simple -Interactive -ValidateOnly
          if ($LASTEXITCODE -ne 0 -or $global:questions -ne 10 -or $global:answerQueue.Count -ne 0) {
            throw "No se respetaron las respuestas interactivas (preguntas: $global:questions)"
          }
          Remove-Item Function:\Read-Host
      - name: Manual profile smoke test (1 worker and custom reports)
        shell: pwsh
        run: |
          ./scripts/benchmark-10m.ps1 -Profile manual -Records 1000 -ReportsDir 'reports/manual tests'
          if ($LASTEXITCODE -ne 0) { throw "El perfil manual ha fallado" }
          $folders = @(Get-ChildItem 'reports/manual tests' -Directory -Filter 'prueba-manual-*')
          if ($folders.Count -ne 1) { throw 'Falta informe del perfil manual' }
          $root = $folders[0].FullName
          foreach($file in @('index.html','prueba-manual.html','resumen.csv','progreso.log','logs/job-manual.log')) {
            if (-not (Test-Path (Join-Path $root $file))) { throw "Falta $file" }
          }
          $r = @(Import-Csv (Join-Path $root 'resumen.csv'))[0]
          if ($r.Status -ne 'COMPLETED' -or $r.Id -ne 'manual' -or
              $r.Read -ne '1000' -or $r.Written -ne '1000' -or
              $r.Grid -ne '1' -or $r.Threads -ne '1' -or
              $r.HeapLimitMiB -ne '256' -or $r.MemoryLimitMiB -ne '500') {
            throw "Parametros de manual incorrectos: $($r | Out-String)"
          }
      - name: Verify consolidated reports/index.html includes historical and nested runs
        shell: pwsh
        run: |
          $index = Join-Path 'reports' 'index.html'
          if (-not (Test-Path -LiteralPath $index)) { throw 'Falta reports/index.html' }
          $html = Get-Content -LiteralPath $index -Raw
          $patterns = @(
            'benchmark-10m-', 'particion-unica-10m-', 'prueba-quick-',
            'prueba-simple-', 'prueba-stress150-', 'prueba-manual-',
            'prueba-A-', 'custom%20outputs', 'manual%20tests',
            'prueba-manual.html', 'prueba-A.html', 'resumen.csv', 'progreso.log'
          )
          foreach ($p in $patterns) {
            if (-not $html.Contains($p)) { throw "Falta $p en el indice general" }
          }
          $folders = @(Get-ChildItem -Path reports -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName 'resumen.csv') })
          if ($folders.Count -lt 7) { throw "El historial deberia contener al menos 7 ejecuciones: $($folders.Count)" }
          Write-Host "Indice general OK. Sesiones: $($folders.Count)"
      - name: Upload HTML smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: reports/
          if-no-files-found: warn
  windows-bat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single Windows BAT entrypoint
        shell: cmd
        run: |
          call test-batch.bat --help
          if errorlevel 1 exit /b 1
          if exist benchmark-10m.bat exit /b 1
      - name: Validate every BAT profile and CLI override without Docker
        shell: cmd
        run: |
          set BATCH_NO_PAUSE=1
          call test-batch.bat -Profile quick -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile medium -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile full -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile custom -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile manual -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat manual -Records 1000 -Grid 1 -Threads 1 -Pool 6 -HeapMiB 128 -MemoryMiB 150 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile single -Records 1000 -Grid 1 -Threads 1 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile simple -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile stress150 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile benchmark -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -ListProfiles
          if errorlevel 1 exit /b 1
          call test-batch.bat medium -Records 1250 -Chunk 250 -Grid 1 -Threads 1 -Pool 6 -ReportsDir "%TEMP%\batch CLI reports" -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat benchmark -Records 1000 -Chunk 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat base -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat A -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat B -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat C -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat 1000 -Grid 1 -Threads 1 -Pool 6 -ValidateOnly
          if errorlevel 1 exit /b 1
      - name: Validate interactive defaults for four benchmark scenarios in Windows PowerShell
        shell: powershell
        run: |
          $global:answerQueue = New-Object System.Collections.Queue
          1..31 | ForEach-Object { $global:answerQueue.Enqueue('') }
          $global:questions = 0
          function Read-Host([string]$Prompt) {
            $global:questions++
            if ($global:answerQueue.Count -eq 0) { throw "Pregunta no prevista: $Prompt" }
            return $global:answerQueue.Dequeue()
          }
          & ./scripts/benchmark-10m.ps1 -Profile benchmark -Interactive -ValidateOnly
          if ($LASTEXITCODE -ne 0 -or $global:questions -ne 31 -or $global:answerQueue.Count -ne 0) {
            throw "El asistente no pregunto por los cuatro escenarios: $global:questions"
          }
      - name: Test MI PRUEBA interactive input and 150MiB custom memory on Windows
        shell: powershell
        run: |
          $global:answerQueue = New-Object System.Collections.Queue
          @('10000','','250','','1','1','6','128','150','') | ForEach-Object { $global:answerQueue.Enqueue($_) }
          $global:questions = 0
          function Read-Host([string]$Prompt) {
            $global:questions++
            if ($global:answerQueue.Count -eq 0) { throw "Pregunta inesperada: $Prompt" }
            return $global:answerQueue.Dequeue()
          }
          $lines = @(& ./scripts/benchmark-10m.ps1 -Profile manual -Interactive -ValidateOnly 6>&1)
          $lines | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or $global:questions -ne 10 -or $global:answerQueue.Count -ne 0) {
            throw "La entrada manual no funciono: $global:questions preguntas"
          }
          if (($lines -join [Environment]::NewLine) -notmatch 'VALIDO: manual Records=10000 Chunk=250 Page=1000 Grid=1 Threads=1 Pool=6 HeapMiB=128 MemoryMiB=150') {
            throw "No se aplicaron los valores escritos en MI PRUEBA"
          }
      - name: Rebuild master index from old and failed reports without Docker
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'batch history with spaces'
          $good = Join-Path $root 'benchmark-10m-20261019-100001-11'
          $failed = Join-Path $root 'manual tests\prueba-manual-20261019-120001-12'
          $pending = Join-Path $root 'prueba-single-20261019-130001-13'
          foreach ($dir in @($good,$failed,$pending)) {
            New-Item -Path $dir -ItemType Directory -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $dir 'progreso.log') -Value 'Iniciando prueba' -Encoding UTF8
          }
          Set-Content -LiteralPath (Join-Path $good 'resumen.csv') -Value "Id,Status,Written$([char]10)base,COMPLETED,1000" -Encoding UTF8
          Add-Content -LiteralPath (Join-Path $good 'progreso.log') -Value 'BENCHMARK TERMINADO'
          Set-Content -LiteralPath (Join-Path $good 'index.html') -Value 'benchmark'
          Set-Content -LiteralPath (Join-Path $good 'prueba-base.html') -Value 'base'
          Set-Content -LiteralPath (Join-Path $failed 'resumen.csv') -Value "Id,Status,Written$([char]10)manual,FAILED,50" -Encoding UTF8
          Add-Content -LiteralPath (Join-Path $failed 'progreso.log') -Value 'ERROR GENERAL: OOM'
          Set-Content -LiteralPath (Join-Path $failed 'prueba-manual.html') -Value 'manual'
          & ./scripts/update-reports-index.ps1 -ReportsDir $root
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo construir el indice historico' }
          $master = Join-Path $root 'index.html'
          if (-not (Test-Path -LiteralPath $master)) { throw 'Falta index.html en la raiz' }
          $html = Get-Content -LiteralPath $master -Raw
          foreach ($fragment in @('3</strong>','1</strong>','FAILED','COMPLETED','EN CURSO',
                                 'benchmark-10m-20261019','prueba-manual-20261019',
                                 'prueba-single-20261019','manual%20tests','prueba-base.html',
                                 'prueba-manual.html','progreso.log')) {
            if (-not $html.Contains($fragment)) { throw "Falta elemento historico: $fragment" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $good 'prueba-base.html'))) {
            throw 'Se elimino un informe historico'
          }
          & ./scripts/update-reports-index.ps1 -ReportsDir $root
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo regenerar el indice' }
      - name: Validate PowerShell 5.1 benchmark syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/benchmark-10m.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/update-reports-index.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
