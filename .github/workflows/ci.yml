name: Java CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test
      - name: Validate benchmark PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/benchmark-10m.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Benchmark smoke test (4 sequential jobs x 1000 records)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Records 1000
      - name: Verify live progress and generated HTML reports
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'benchmark-10m-*')
          if ($reports.Count -ne 1) { throw "Se esperaba exactamente un directorio de benchmark" }
          $dir = $reports[0].FullName
          $expected = @(
            'index.html','prueba-base.html','prueba-A.html','prueba-B.html','prueba-C.html',
            'resumen.csv','progreso.log',
            'logs/job-base.log','logs/job-A.log','logs/job-B.log','logs/job-C.log'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path $dir $file))) {
              throw "Falta el archivo $file en $dir"
            }
          }
          $logText = Get-Content (Join-Path $dir 'progreso.log') -Raw
          if ($logText -notmatch 'AVANCE:') { throw "No se generaron avances de lectura/escritura" }
          if ($logText -notmatch 'BENCHMARK TERMINADO') { throw "Falta el cierre correcto del benchmark" }
      - name: Single-partition smoke test (1 worker, 1000 records)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Records 1000 -SinglePartition
      - name: Verify single-partition HTML and metadata
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'particion-unica-10m-*')
          if ($reports.Count -ne 1) { throw "Se esperaba un informe de particion unica" }
          $dir = $reports[0].FullName
          foreach ($file in @('index.html','prueba-single.html','resumen.csv','progreso.log','logs/job-single.log')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file en $dir" }
          }
          $rows = @(Import-Csv (Join-Path $dir 'resumen.csv'))
          if ($rows.Count -ne 1) { throw "Se esperaba exactamente una prueba" }
          $r = $rows[0]
          if ($r.Id -ne 'single' -or $r.Grid -ne '1' -or $r.Threads -ne '1' -or
              $r.Chunk -ne '500' -or $r.Page -ne '1000' -or $r.DbPool -ne '6' -or
              $r.Status -ne 'COMPLETED' -or $r.Read -ne '1000' -or $r.Written -ne '1000') {
            throw "Configuracion o contadores inesperados: $($r | Out-String)"
          }
          $progress = Get-Content (Join-Path $dir 'progreso.log') -Raw
          if ($progress -notmatch 'PRUEBA single AVANCE:') { throw "Falta progreso de particion unica" }
      - name: Validate all test profiles without Docker
        shell: pwsh
        run: |
          foreach ($profile in @('quick','medium','full','custom','single','simple','benchmark')) {
            ./scripts/benchmark-10m.ps1 -Profile $profile -Records 1000 -ValidateOnly
            if ($LASTEXITCODE -ne 0) { throw "Perfil invalido: $profile" }
          }
      - name: Parameterized quick test and HTML (custom limits)
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Profile quick -Records 1000 -Chunk 1000 -Page 1000 -Grid 1 -Threads 1 -Pool 6 -HeapMiB 256 -MemoryMiB 768 -SeedBlock 500
      - name: Verify parameter overrides in report and Compose
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path reports -Directory -Filter 'prueba-quick-*')
          if ($reports.Count -ne 1) { throw "Se esperaba un informe quick" }
          $dir = $reports[0].FullName
          $r = @(Import-Csv (Join-Path $dir 'resumen.csv'))[0]
          if ($r.Chunk -ne '1000' -or $r.Page -ne '1000' -or $r.Grid -ne '1' -or
              $r.Threads -ne '1' -or $r.DbPool -ne '6' -or $r.HeapLimitMiB -ne '256' -or
              $r.MemoryLimitMiB -ne '768' -or $r.SeedBlock -ne '500' -or
              $r.Written -ne '1000' -or $r.Status -ne 'COMPLETED') {
            throw "Override no aplicado: $($r | Out-String)"
          }
          if (-not (Test-Path (Join-Path $dir 'prueba-quick.html'))) { throw "Falta HTML quick" }
      - name: Simple 500MiB Batch memory smoke test
        shell: pwsh
        run: ./scripts/benchmark-10m.ps1 -Profile simple
      - name: Verify simple test limits and HTML report
        shell: pwsh
        run: |
          $dirs = @(Get-ChildItem -Path reports -Directory -Filter 'prueba-simple-*')
          if ($dirs.Count -ne 1) { throw "Se esperaba un informe simple" }
          $dir = $dirs[0].FullName
          foreach ($file in @('index.html','prueba-simple.html','resumen.csv','progreso.log','logs/job-simple.log')) {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Falta $file" }
          }
          $r = @(Import-Csv (Join-Path $dir 'resumen.csv'))[0]
          if ($r.Id -ne 'simple' -or $r.Read -ne '1000' -or $r.Written -ne '1000' -or
              $r.Grid -ne '1' -or $r.Threads -ne '1' -or
              $r.MemoryLimitMiB -ne '500' -or $r.HeapLimitMiB -ne '256' -or
              $r.Status -ne 'COMPLETED') {
            throw "Configuracion simple inesperada: $($r | Out-String)"
          }
      - name: Upload HTML smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: reports/
          if-no-files-found: warn
  windows-bat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single Windows BAT entrypoint
        shell: cmd
        run: |
          call test-batch.bat --help
          if errorlevel 1 exit /b 1
          if exist benchmark-10m.bat exit /b 1
      - name: Validate every BAT profile and CLI override without Docker
        shell: cmd
        run: |
          set BATCH_NO_PAUSE=1
          call test-batch.bat -Profile quick -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile medium -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile full -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile custom -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile single -Records 1000 -Grid 1 -Threads 1 -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile simple -ValidateOnly
          if errorlevel 1 exit /b 1
          call test-batch.bat -Profile benchmark -Records 1000 -ValidateOnly
          if errorlevel 1 exit /b 1
      - name: Validate PowerShell 5.1 benchmark syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/benchmark-10m.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
